steps:
  - name: node:24-slim
    id: quality
    entrypoint: bash
    args:
      - -ceu
      - |
        apt-get update
        apt-get install -y --no-install-recommends python3 python3-venv
        python3 -m venv /tmp/printdesk-venv
        /tmp/printdesk-venv/bin/pip install --requirement packages/ticket-renderer/requirements.txt
        export PRINTDESK_PYTHON=/tmp/printdesk-venv/bin/python
        corepack enable
        pnpm install --frozen-lockfile
        pnpm typecheck
        pnpm test
        pnpm test:e2e
        /tmp/printdesk-venv/bin/python -m unittest discover -s packages/ticket-renderer/tests

  - name: gcr.io/cloud-builders/docker
    id: api-image
    waitFor: [quality]
    args:
      - build
      - --file=apps/api/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/printdesk-api:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/printdesk-api:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: render-image
    waitFor: [quality]
    args:
      - build
      - --file=apps/render-service/Dockerfile
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/printdesk-render:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/printdesk-render:latest
      - .

  - name: gcr.io/cloud-builders/docker
    id: web-image
    waitFor: [quality]
    args:
      - build
      - --file=apps/web/Dockerfile
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=${_WEB_API_BASE_URL}
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_WEB_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_WEB_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_WEB_FIREBASE_PROJECT_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_WEB_FIREBASE_APP_ID}
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/printdesk-web:$SHORT_SHA
      - --tag=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/printdesk-web:latest
      - .

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/printdesk-api:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/printdesk-api:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/printdesk-render:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/printdesk-render:latest
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/printdesk-web:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/printdesk-web:latest

substitutions:
  _REGION: europe-southwest1
  _AR_REPOSITORY: printdesk
  _WEB_API_BASE_URL: https://printdesk-api-128063282321.europe-southwest1.run.app
  _WEB_FIREBASE_API_KEY: configure-in-trigger
  _WEB_FIREBASE_AUTH_DOMAIN: printdesk-503214.firebaseapp.com
  _WEB_FIREBASE_PROJECT_ID: printdesk-503214
  _WEB_FIREBASE_APP_ID: configure-in-trigger

options:
  logging: CLOUD_LOGGING_ONLY
